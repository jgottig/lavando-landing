<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lavando · Estado de Máquinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ==============================
   VARIABLES & RESET
============================== */
:root {
  --magenta:  #EB038A;
  --azul:     #0767B0;
  --celeste:  #64ABDB;
  --lima:     #90C63C;
  --turquesa: #04A7AD;

  --c-free:    #5A9E18;
  --c-busy:    #D63030;
  --c-washer:  #D63030;
  --c-dryer:   #D63030;
  --c-finish:  #D63030;

  --bg:      #F0EEF8;
  --surface: #FFFFFF;
  --text:    #14132B;
  --muted:   rgba(20,19,43,.45);
  --border:  rgba(20,19,43,.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ==============================
   ANIMATIONS
============================== */
@keyframes spin-cw  { to { transform: rotate(360deg); } }
@keyframes spin-fast { to { transform: rotate(360deg); } }
.drum-spin      { animation: spin-cw   3.2s linear infinite; transform-origin: 0 0; }
.drum-spin-fast { animation: spin-fast 1.6s linear infinite; transform-origin: 0 0; }

@keyframes card-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(214,48,48,.0); }
  50%      { box-shadow: 0 0 0 10px rgba(214,48,48,.22); }
}
@keyframes pulse-live {
  0%,100% { box-shadow: 0 0 0 0 rgba(90,158,24,.5); }
  50%      { box-shadow: 0 0 0 8px rgba(90,158,24,.0); }
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: .25; }
}
@keyframes progress-stripe {
  to { background-position: 30px 0; }
}

/* ==============================
   SCREEN LAYOUT
============================== */
.screen {
  display: grid;
  grid-template-rows: 70px 1fr;
  height: 100vh;
  width: 100vw;
}

.body {
  display: grid;
  grid-template-columns: 1fr 390px;
  min-height: 0;
  overflow: hidden;
}

/* ==============================
   HEADER
============================== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  border-bottom: 1.5px solid var(--border);
  background: var(--surface);
  box-shadow: 0 2px 10px rgba(20,19,43,.06);
  flex-shrink: 0;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 14px;
}
.header-logo img { height: 36px; width: auto; display: block; }

.h-sep {
  width: 2px; height: 24px;
  background: var(--border);
  border-radius: 2px;
}

.header-subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.header-live {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--c-free);
}
.live-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--c-free);
  animation: pulse-live 1.6s ease-in-out infinite;
}

.header-clock {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.045em;
  color: var(--text);
  min-width: 110px;
  text-align: right;
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hstat {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(20,19,43,.05);
  border: 1.5px solid var(--border);
}
.hstat-val {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
}
.hstat-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1.3;
}

/* ==============================
   MACHINES PANEL
============================== */
.machines-panel {
  padding: 20px 24px;
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* JS sobreescribe esto al cargar */
  grid-template-rows: repeat(2, 1fr);
  gap: 14px;
  min-height: 0;
}

/* ==============================
   MACHINE CARD
============================== */
.card {
  border-radius: 18px;
  border: 1.5px solid var(--border);
  padding: 12px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  overflow: hidden;
  transition: border-color .4s ease, box-shadow .4s ease;
  background: var(--surface);
  box-shadow: 0 2px 10px rgba(20,19,43,.07);
}

/* State theming */
.card.free     { border-color: rgba(90,158,24,.5);   background: #F6FDF0; }
.card.busy-w   { border-color: rgba(214,48,48,.4);   background: #FFF3F3; }
.card.busy-d   { border-color: rgba(214,48,48,.4);   background: #FFF3F3; }
.card.finishing {
  border-color: rgba(214,48,48,.65);
  background: #FFF0F0;
  animation: card-pulse 1.4s ease-in-out infinite;
}
.card.offline, .card.error {
  border-color: var(--border);
  background: #F8F8FA;
  box-shadow: none;
  opacity: .6;
}
.card.error { border-color: rgba(220,50,50,.3); opacity: .7; }

/* Corner accent */
.card::after {
  content: '';
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  top: -40px; right: -40px;
  pointer-events: none;
  opacity: .15;
}
.free::after                          { background: var(--c-free); }
.busy-w::after, .busy-d::after,
.finishing::after                     { background: var(--c-busy); }

/* ---- card top row ---- */
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.card-num {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(18px, 1.6vw, 26px);
  font-weight: 800;
  letter-spacing: -0.02em;
}
.free .card-num      { color: var(--c-free); }
.busy-w .card-num    { color: var(--c-washer); }
.busy-d .card-num    { color: var(--c-dryer); }
.finishing .card-num { color: var(--c-finish); }
.offline .card-num, .error .card-num { color: rgba(20,19,43,.3); }
.error .card-num { color: rgba(200,50,50,.6); }

.badge {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 9px 18px;
  border-radius: 999px;
  border: none;
  line-height: 1;
  color: #fff;
  white-space: nowrap;
}
.free .badge      { background: var(--c-free); }
.busy-w .badge    { background: var(--c-busy); }
.busy-d .badge    { background: var(--c-busy); }
.finishing .badge { background: var(--c-busy); }
.offline .badge, .error .badge {
  color: var(--muted);
  background: rgba(20,19,43,.08);
  border: 1.5px solid var(--border);
  font-size: 11px;
  padding: 7px 14px;
}
.error .badge { color: rgba(200,50,50,.8); background: rgba(220,50,50,.1); border-color: rgba(220,50,50,.3); }

.bdot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.free .bdot      { background: var(--c-free); }
.busy-w .bdot    { background: var(--c-washer); animation: blink 2s ease-in-out infinite; }
.busy-d .bdot    { background: var(--c-dryer);  animation: blink 2s ease-in-out infinite; }
.finishing .bdot { background: var(--c-finish); animation: blink .7s ease-in-out infinite; }
.offline .bdot, .error .bdot { background: rgba(20,19,43,.3); }
.error .bdot { background: rgba(200,50,50,.7); }

/* ---- card center: icon + label ---- */
.card-center {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-height: 0;
}

.mach-svg {
  flex-shrink: 0;
  width: clamp(52px, 5vw, 72px);
  height: clamp(58px, 5.5vw, 80px);
  filter: drop-shadow(0 3px 8px rgba(20,19,43,.18));
}

.card-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex: 1;
}

.card-type {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
  color: var(--text);
}
.free .card-type      { color: var(--c-free); }
.busy-w .card-type    { color: var(--c-washer); }
.busy-d .card-type    { color: var(--c-dryer); }
.finishing .card-type { color: var(--c-finish); }
.offline .card-type, .error .card-type { color: var(--muted); }

/* Free sub */
.free-available {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--c-free);
  opacity: .85;
  margin-top: 6px;
}

/* Busy: timer */
.time-big {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(26px, 2.4vw, 38px);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: .9;
  margin-top: 4px;
}
.busy-w .time-big    { color: var(--c-washer); }
.busy-d .time-big    { color: var(--c-dryer); }
.finishing .time-big { color: var(--c-finish); }

.time-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}

/* Progress bar */
.bar-wrap { margin-top: 8px; }
.bar-track {
  height: 9px;
  background: rgba(20,19,43,.1);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 5px;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 1s linear;
  position: relative;
}
.bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    rgba(255,255,255,.0) 0,
    rgba(255,255,255,.0) 10px,
    rgba(255,255,255,.25) 10px,
    rgba(255,255,255,.25) 20px
  );
  background-size: 30px 100%;
  animation: progress-stripe 1.2s linear infinite;
}
.busy-w .bar-fill    { background: var(--c-washer); }
.busy-d .bar-fill    { background: var(--c-dryer); }
.finishing .bar-fill { background: var(--c-finish); }

.bar-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .06em;
}

/* Free big check */
.free-check {
  font-size: clamp(24px, 2.2vw, 34px);
  line-height: 1;
  margin-top: 6px;
}

/* Offline message */
.offline-msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
}

/* ==============================
   MEDIA PANEL
============================== */
.media-panel {
  border-left: 1.5px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* YouTube player */
.video-panel {
  flex-shrink: 0;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  position: relative;
  overflow: hidden;
  border-bottom: 1.5px solid var(--border);
}
.video-panel iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.video-panel.hidden { display: none; }

.slide-prog-bar {
  height: 3px;
  background: rgba(20,19,43,.1);
  flex-shrink: 0;
  position: relative;
}
.slide-prog-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--c-free);
  width: 0%;
}

.media-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #DDD9F0;
  min-height: 0;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 28px;
  text-align: center;
  opacity: 0;
  transition: opacity .75s ease;
  pointer-events: none;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
}
.slide img, .slide video {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}

.slide-inner { position: relative; z-index: 2; color: #fff; }

.s-icon  { font-size: 52px; line-height: 1; margin-bottom: 14px; }
.s-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .75;
  margin-bottom: 10px;
}
.s-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: .92;
  margin-bottom: 14px;
}
.s-body {
  font-size: 14px;
  opacity: .85;
  line-height: 1.55;
  max-width: 270px;
  margin: 0 auto;
}

.slide-magenta { background: var(--magenta); }
.slide-azul    { background: var(--azul); }
.slide-dark    { background: #1C1A38; }
.slide-lima    { background: #2A4D0A; }

.media-dots {
  display: flex;
  gap: 5px;
  justify-content: center;
  padding: 8px;
  flex-shrink: 0;
  background: rgba(20,19,43,.06);
}
.mdot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(20,19,43,.2);
  transition: background .3s, transform .3s;
}
.mdot.active { background: var(--c-free); transform: scale(1.5); }

.media-footer {
  flex-shrink: 0;
  padding: 14px 20px;
  border-top: 1.5px solid var(--border);
  background: var(--surface);
}
.footer-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.fstat-val {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 1;
}
.fstat-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 2px;
}

/* ==============================
   CICLO ID
============================== */
.ciclo-id {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(16px, 1.4vw, 22px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-top: 2px;
}

/* ==============================
   SUB-CICLOS / ETAPAS
============================== */
.subcycles {
  display: flex;
  gap: 3px;
  margin-top: 9px;
}
.sc {
  flex: 1;
  height: 5px;
  border-radius: 2px;
  background: rgba(20,19,43,.1);
  position: relative;
  overflow: hidden;
  min-width: 4px;
}
.sc-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 2px;
  transition: width .8s linear;
}
.busy-w   .subcycles { --sc-col: var(--c-washer); }
.busy-d   .subcycles { --sc-col: var(--c-dryer); }
.finishing .subcycles { --sc-col: var(--c-finish); }
.sc.done      { background: var(--sc-col); opacity: .7; }
.sc.done-full { background: var(--sc-col); opacity: .85; }
.sc-fill      { background: var(--sc-col); opacity: .9; }

.sc-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: .07em;
  margin-top: 4px;
}

/* ==============================
   API STATUS INDICATOR
============================== */
.api-status {
  position: fixed;
  bottom: 12px;
  left: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .4;
  color: var(--text);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 6px;
}
.api-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--c-free);
}
.api-dot.err { background: #E03030; }

/* ==============================
   LAUNCH OVERLAY (tap to start)
============================== */
#launch-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--magenta);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  cursor: pointer;
  user-select: none;
}
#launch-overlay img {
  height: 64px;
  width: auto;
  border-radius: 12px;
}
#launch-overlay .lo-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 52px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.04em;
  line-height: 1;
}
#launch-overlay .lo-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
  animation: blink 1.6s ease-in-out infinite;
}
#launch-overlay.hidden { display: none; }

/* ==============================
   FULLSCREEN BUTTON
============================== */
#fs-btn {
  position: fixed;
  bottom: 12px;
  right: 20px;
  z-index: 100;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .3;
  cursor: pointer;
  user-select: none;
  transition: opacity .25s;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 8px;
  background: rgba(20,19,43,.06);
  border: 1px solid var(--border);
}
#fs-btn:hover { opacity: .85; }
:fullscreen #fs-btn, :-webkit-full-screen #fs-btn { opacity: .15; }
</style>
</head>
<body>

<!-- Tap-to-start overlay — goes fullscreen on first touch -->
<div id="launch-overlay">
  <img src="assets/logo-lavando.jpeg" alt="Lavando" />
  <div class="lo-title">Estado de Máquinas</div>
  <div id="lo-local" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:-10px;"></div>
  <div class="lo-hint">Tocá la pantalla para comenzar</div>
</div>

<div class="screen">

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <img src="assets/logo-lavando.jpeg" alt="Lavando" />
      <div class="h-sep"></div>
      <div class="header-subtitle">Estado de Máquinas</div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;margin-left:auto;margin-right:28px;">
      <div class="header-live">
        <div class="live-dot"></div>
        En vivo · Zeballos 1530
      </div>
      <div class="h-sep"></div>
      <div class="header-stats">
        <div class="hstat">
          <div class="hstat-val" id="s-free" style="color:var(--c-free)">–</div>
          <div class="hstat-lbl">Disponibles</div>
        </div>
        <div class="hstat">
          <div class="hstat-val" id="s-busy" style="color:var(--c-dryer)">–</div>
          <div class="hstat-lbl">En uso</div>
        </div>
        <div class="hstat">
          <div class="hstat-val" id="s-wash" style="color:var(--c-washer)">–</div>
          <div class="hstat-lbl">Lavadoras</div>
        </div>
        <div class="hstat">
          <div class="hstat-val" id="s-dry" style="color:var(--c-dryer)">–</div>
          <div class="hstat-lbl">Secadoras</div>
        </div>
      </div>
    </div>
    <div class="header-clock" id="clock">00:00</div>
  </header>

  <!-- BODY -->
  <div class="body">

    <!-- MACHINES -->
    <div class="machines-panel" id="machines-panel"></div>

    <!-- MEDIA -->
    <div class="media-panel">
      <div class="video-panel hidden" id="video-panel"></div>
      <div class="slide-prog-bar">
        <div class="slide-prog-fill" id="slide-fill"></div>
      </div>
      <div class="media-area" id="media-area"></div>
      <div class="media-dots" id="media-dots"></div>
    </div>

  </div>
</div>

// =============================================================
//  PUBLICACIONES (video desde API)
//  Consulta recurso=publicacoes, filtra por activo + período vigente
//  y construye el player con los YouTube IDs resultantes.
//  YOUTUBE_FALLBACK se usa si la API no devuelve nada.
// =============================================================
const YOUTUBE_FALLBACK = 'https://www.youtube.com/watch?v=OO2kPK5-qno';
const PUBS_POLL_MS = 60000; // re-chequea publicaciones cada minuto

function getYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function isPublicacionActiva(p) {
  // Acepta nombres de columna en español (activo) y portugués (ativo)
  const activo = p.ativo ?? p.activo ?? true;
  if (!activo) return false;
  const ahora  = new Date();
  const inicio = p.dt_inicio  || p.fecha_inicio || p.data_inicio || null;
  const fin    = p.dt_fin     || p.fecha_fin    || p.data_fim    || null;
  if (inicio && new Date(inicio) > ahora) return false;
  if (fin    && new Date(fin)    < ahora) return false;
  return true;
}

function buildVideoPanelFromIds(ids) {
  const panel = document.getElementById('video-panel');
  if (!ids || ids.length === 0) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  const first    = ids[0];
  const playlist = ids.join(',');
  const src = `https://www.youtube.com/embed/${first}?autoplay=1&mute=0&loop=1&playlist=${playlist}&controls=1&rel=0&modestbranding=1`;
  // No reconstruir el iframe si el playlist no cambió (evita cortar la reproducción)
  if (panel.dataset.src === src) return;
  panel.dataset.src = src;
  panel.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}

async function fetchPublicaciones() {
  try {
    const url = `https://curavdphpnzbnxpkqatr.supabase.co/functions/v1/api-apptv?recurso=publicacoes&idLocal=${ID_LOCAL}`;
    const res = await fetch(url, { method: 'GET', headers: { 'x-api-key': API_KEY } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    if (json.sucesso && Array.isArray(json.dados) && json.dados.length > 0) {
      const activas = json.dados.filter(isPublicacionActiva);
      // Busca URL en columnas posibles: url, link, url_video
      const ids = activas
        .map(p => getYouTubeId(p.url || p.link || p.url_video || ''))
        .filter(Boolean);
      const fbId = getYouTubeId(YOUTUBE_FALLBACK);
      buildVideoPanelFromIds(ids.length > 0 ? ids : (fbId ? [fbId] : []));
    } else {
      const fbId = getYouTubeId(YOUTUBE_FALLBACK);
      buildVideoPanelFromIds(fbId ? [fbId] : []);
    }
  } catch (err) {
    console.error('[Lavando Publicaciones]', err);
    // En error: usar fallback solo si el panel todavía no tiene video
    const panel = document.getElementById('video-panel');
    if (panel.classList.contains('hidden')) {
      const fbId = getYouTubeId(YOUTUBE_FALLBACK);
      buildVideoPanelFromIds(fbId ? [fbId] : []);
    }
  }
}

// =============================================================
//  API CONFIG
//  idLocal se lee de la URL: status.html?idLocal=2
//  Si no está presente se usa 1 (local por defecto).
// =============================================================
const ID_LOCAL = new URLSearchParams(window.location.search).get('idLocal') || '1';
const API_URL  = `https://curavdphpnzbnxpkqatr.supabase.co/functions/v1/api-apptv?recurso=status_maquinas&idLocal=${ID_LOCAL}`;
const API_KEY  = 'lavapptv2025';
const POLL_MS  = 5000;
const TICK_MS  = 1000;

// Estado inicial: placeholder genérico hasta que llegue la primera respuesta de la API
let machines = Array.from({ length: 6 }, (_, i) => ({
  idMaqLoc: i + 1,
  type:     'washer',
  label:    '–',
  status:   'offline',
  elapsed:  null,
  dur:      null,
}));

// =============================================================
//  PARSER — convierte un item del array dados[] en estado interno
//
//  Status: 1=Disponible  2=En Uso  0=Indisponible  -1=Error
//  MinReal: minutos REALES transcurridos (solo válido en Status=2)
//  EtapaCiclo / CtdeEtapas: etapa actual / total de etapas
// =============================================================
function parseMachine(d) {
  const loc   = d.idMaqLoc;
  const type  = d.TipoMaquina.toLowerCase().includes('lavadora') ? 'washer' : 'dryer';
  const label = d.TipoMaquina;
  const base  = { idMaqLoc: loc, type, label, idCiclo: d.idCiclo };

  // Coerción explícita: el API puede devolver StatusFinal como número o string
  const st = Number(d.StatusFinal);

  if (st === -1) return { ...base, status: 'error',   elapsed: null, dur: null };
  if (st ===  0) return { ...base, status: 'offline', elapsed: null, dur: null };
  if (st ===  1) return { ...base, status: 'free',    elapsed: null, dur: null };

  // st === 2: En Uso
  // MinReal = minutos reales transcurridos del ciclo en curso
  const durSec     = (d.TiempoEstMin || 0) * 60;
  const elapsedSec = durSec > 0
    ? Math.min(Math.floor((d.MinReal || 0) * 60), durSec)
    : Math.floor((d.MinReal || 0) * 60);

  return {
    ...base,
    status:       'busy',
    elapsed:      elapsedSec,
    dur:          durSec || 3600,  // fallback 60 min si no hay TiempoEstMin
    etapa:        d.EtapaCiclo    || 1,
    totalEtapas:  d.CtdeEtapas   || 1,
    tiempoEstMin: d.TiempoEstMin  || 60,
  };
}

// =============================================================
//  FETCH — consulta la API y actualiza el estado
// =============================================================
async function fetchMachines() {
  try {
    const res = await fetch(API_URL, {
      method: 'GET',
      headers: { 'x-api-key': API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    if (json.sucesso && Array.isArray(json.dados) && json.dados.length > 0) {
      // Tomar exactamente las máquinas que devuelve la API, ordenadas por posición
      machines = json.dados
        .map(d => parseMachine(d))
        .sort((a, b) => a.idMaqLoc - b.idMaqLoc);

      setApiStatus(true, json.atualizado_em);
      renderMachines();
      renderSummary();
    }
  } catch (err) {
    console.error('[Lavando API]', err);
    setApiStatus(false);
    // Mantener el último estado visible sin borrarlo
  }
}

// =============================================================
//  LOCAL TICK — countdown suave entre polls de la API
// =============================================================
function localTick() {
  let changed = false;
  machines = machines.map(m => {
    if (m.status !== 'busy') return m;
    const next = Math.min(m.elapsed + 1, m.dur);
    if (next === m.elapsed) return m; // ya en el tope, sin cambio
    changed = true;
    return { ...m, elapsed: next };
    // Nunca cambiamos a 'free' localmente: solo la API decide eso.
    // Cuando elapsed == dur el contador muestra 0 min / TERMINANDO
    // y se estabiliza hasta que el próximo poll confirme el cambio.
  });
  if (changed) {
    renderMachines();
    renderSummary();
  }
}

// =============================================================
//  CARD RENDERER
// =============================================================
const HEX = {
  free:     '#5A9E18',
  'busy-w': '#D63030',
  'busy-d': '#D63030',
  finishing:'#D63030',
  offline:  '#9896B0',
  error:    '#DC3232',
};

function stateClass(m) {
  if (m.status === 'offline') return 'offline';
  if (m.status === 'error')   return 'error';
  if (m.status === 'free')    return 'free';
  if (m.status === 'busy') {
    if (m.dur - m.elapsed <= 120) return 'finishing';
    return m.type === 'washer' ? 'busy-w' : 'busy-d';
  }
  return 'offline';
}

// =============================================================
//  SUB-CICLOS — segmentos de etapas con progreso interno
// =============================================================
function renderSubcycles(m) {
  return ''; // oculto — descomentar la línea de abajo para reactivar
  if (!m.totalEtapas || m.totalEtapas < 2 || !m.tiempoEstMin) return '';

  const minPerStage    = m.tiempoEstMin / m.totalEtapas;
  const elapsedMin     = m.elapsed / 60;
  // Etapas completadas antes de la actual (basado en tiempo local)
  const stagesDone     = Math.min(m.etapa - 1, Math.floor(elapsedMin / minPerStage));
  // Progreso dentro de la etapa actual
  const timeInCurrent  = Math.max(0, elapsedMin - stagesDone * minPerStage);
  const stagePct       = Math.min(100, Math.round((timeInCurrent / minPerStage) * 100));

  const segs = Array.from({ length: m.totalEtapas }, (_, i) => {
    const n = i + 1;
    if (n < m.etapa) {
      // Etapa completada (según API)
      return `<div class="sc done-full"></div>`;
    } else if (n === m.etapa) {
      // Etapa actual: barra de progreso interno
      return `<div class="sc"><div class="sc-fill" style="width:${stagePct}%"></div></div>`;
    } else {
      return `<div class="sc"></div>`;
    }
  }).join('');

  return `<div class="subcycles">${segs}</div>
    <div class="sc-label">Etapa ${m.etapa} de ${m.totalEtapas}</div>`;
}

function renderCard(m) {
  const cls      = stateClass(m);
  const hex      = HEX[cls] || HEX.offline;
  const spinning = (m.status === 'busy');
  const spinCls  = cls === 'finishing' ? 'drum-spin-fast' : spinning ? 'drum-spin' : '';

  let svgStr = m.type === 'washer' ? washerSVG(hex, spinning) : dryerSVG(hex, spinning);
  if (cls === 'finishing') svgStr = svgStr.replace(/drum-spin\b/g, 'drum-spin-fast');

  let badgeLabel, infoHtml;

  const cicloTag = m.idCiclo
    ? `<div class="ciclo-id">Ciclo #${m.idCiclo}</div>`
    : '';

  if (m.status === 'offline') {
    badgeLabel = 'NO DISPONIBLE';
    infoHtml = `
      ${cicloTag}
      <div class="offline-msg">⚠ Fuera de servicio</div>`;

  } else if (m.status === 'error') {
    badgeLabel = 'ERROR';
    infoHtml = `
      ${cicloTag}
      <div class="offline-msg" style="color:rgba(200,50,50,.7)">⚠ Error en máquina</div>`;

  } else if (m.status === 'free') {
    badgeLabel = 'DISPONIBLE';
    infoHtml = `
      ${cicloTag}
      <div class="free-check">✓</div>`;

  } else {
    badgeLabel = cls === 'finishing' ? 'TERMINANDO' : 'EN USO';
    const secsLeft = m.dur - m.elapsed;
    const minsLeft = Math.ceil(secsLeft / 60);
    const pct      = Math.min(100, Math.round((m.elapsed / m.dur) * 100));
    const subLabel = cls === 'finishing' ? '¡Casi lista!' : 'Min restantes';
    infoHtml = `
      ${cicloTag}
      <div class="time-big">${minsLeft}<span style="font-size:20px;opacity:.5"> min</span></div>
      <div class="time-sub">${subLabel}</div>
      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct}% completado</div>
      </div>
      ${renderSubcycles(m)}`;
  }

  return `
    <div class="card ${cls}">
      <div class="card-top">
        <div class="card-num">${m.type === 'washer' ? 'Lavadora' : 'Secadora'} ${m.idMaqLoc}</div>
        <div class="badge">${badgeLabel}</div>
      </div>
      <div class="card-center">
        ${svgStr}
        <div class="card-info">${infoHtml}</div>
      </div>
    </div>`;
}

function renderMachines() {
  const n     = machines.length;
  const cols  = Math.ceil(n / 2);
  const panel = document.getElementById('machines-panel');

  // Ajustar grid dinámicamente según cantidad de máquinas
  panel.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  panel.style.gridTemplateRows    = 'repeat(2, 1fr)';

  // Orden de columnas de a pares: índices pares primero (fila 1), impares después (fila 2)
  // Ej: 6 máq → [0,2,4, 1,3,5] → posiciones 1,3,5 arriba / 2,4,6 abajo
  const evens   = machines.filter((_, i) => i % 2 === 0);
  const odds    = machines.filter((_, i) => i % 2 === 1);
  panel.innerHTML = [...evens, ...odds].map(renderCard).join('');
}

function renderSummary() {
  const free = machines.filter(m => m.status === 'free').length;
  const busy = machines.filter(m => m.status === 'busy').length;

  document.getElementById('s-busy').textContent = busy;

];
const SLIDE_MS = 9000;
let curSlide = 0;

function buildSlides() {
  const area = document.getElementById('media-area');
  const dots = document.getElementById('media-dots');

  area.innerHTML = SLIDES.map((s, i) => {
    if (s.type === 'video') {
      return `<div class="slide ${i===0?'active':''}"><video src="${s.src}" autoplay muted loop playsinline></video></div>`;
    }
    if (s.type === 'image') {
      return `<div class="slide ${i===0?'active':''}"><img src="${s.src}" alt=""/></div>`;
    }
    const tc = s.titleColor ? `style="color:${s.titleColor}"` : '';
    const t  = s.title.split('\n').join('<br>');

      <div class="slide ${s.cls} ${i===0?'active':''}">

          <div class="s-icon">${s.icon}</div>
          <div class="s-label">${s.label}</div>
          <div class="s-title" ${tc}>${t}</div>
          <div class="s-body">${s.body}</div>
        </div>
      </div>`;
  }).join('');

  dots.innerHTML = SLIDES.map((_,i) =>
    `<div class="mdot ${i===0?'active':''}"></div>`
  ).join('');
}

function advanceSlide() {
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.mdot');
  slides[curSlide].classList.remove('active');
  dots[curSlide].classList.remove('active');
  curSlide = (curSlide + 1) % SLIDES.length;
  slides[curSlide].classList.add('active');
  dots[curSlide].classList.add('active');
  startProgress();
}

function startProgress() {
  const fill = document.getElementById('slide-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${SLIDE_MS}ms linear`;
    fill.style.width = '100%';
  }));
}

// =============================================================
//  INIT
// =============================================================
function init() {
  buildSlides();
  renderMachines();   // muestra placeholders offline mientras carga
  renderSummary();
  tickClock();
  startProgress();

  // Publicaciones (videos): carga inmediata y re-chequeo cada minuto
  fetchPublicaciones();
  setInterval(fetchPublicaciones, PUBS_POLL_MS);

  // Estado máquinas: primera carga inmediata, luego cada 5 segundos
  fetchMachines();
  setInterval(fetchMachines, POLL_MS);

  // Countdown local cada 1 segundo
  setInterval(localTick, TICK_MS);

  // Reloj y slides
  setInterval(tickClock, 1000);
  setInterval(advanceSlide, SLIDE_MS);
}

// =============================================================
//  FULLSCREEN + LAUNCH OVERLAY
// =============================================================
const fsBtn   = document.getElementById('fs-btn');
const overlay = document.getElementById('launch-overlay');

function enterFullscreen() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (fn) fn.call(el).catch(() => {});
}

function exitFullscreen() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if (fn) fn.call(document).catch(() => {});
}

function updateFsBtn() {
  const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsBtn.textContent = inFs ? '✕ Salir' : '⛶ Pantalla completa';
}

// Mostrar idLocal en el overlay para confirmar configuración
document.getElementById('lo-local').textContent = `Local ${ID_LOCAL}`;

// Al tocar el overlay: fullscreen + ocultar overlay
overlay.addEventListener('click', () => {
  enterFullscreen();
  overlay.classList.add('hidden');
});

fsBtn.addEventListener('click', () => {
  const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  inFs ? exitFullscreen() : enterFullscreen();
});

document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

init();
</script>
</body>
</html>
